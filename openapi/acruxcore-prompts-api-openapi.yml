components:
  schemas:
    GetApiV1PromptsVersionsTracesResponse:
      type: object
      properties:
        data:
          type: array
          description: Array of trace summary objects.
        total:
          type: integer
          description: Total number of matching traces.
        page:
          type: integer
          description: Current page number.
        limit:
          type: integer
          description: Page size returned.
    PutPromptsIdToolsToolidResponse:
      type: object
      properties:
        toolId:
          type: string
        toolName:
          type: string
        toolAlias:
          type: string
        pinnedVersionNumber:
          type: integer
        'off':
          type: boolean
        resolvedVersionNumber:
          type: integer
        position:
          type: integer
    PutPromptsIdToolsToolidRequest:
      type: object
      properties:
        tool_alias:
          type: string
          description: Alias of the tool version to bind (e.g., "production")
      required:
      - tool_alias
    PostPromptsResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        teamId:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
    GetPromptsIdVersionsNResponse:
      type: object
      properties:
        prompt:
          type: object
          description: Prompt definition.
    PostPromptsIdVersionsResponse:
      type: object
      properties:
        id:
          type: string
        promptId:
          type: string
        versionNumber:
          type: integer
        messages:
          type: array
        variables:
          type: array
        aliases:
          type: array
    PostApiV1PromptsImportResponse:
      type: object
      properties:
        prompt:
          type: object
          description: Created prompt.
        prompt.id:
          type: string
          description: Prompt identifier.
        prompt.name:
          type: string
          description: Name of the created prompt (may be altered on collision).
        version:
          type: object
          description: Created version.
        version.id:
          type: string
          description: Version identifier.
        version.versionNumber:
          type: integer
          description: Version number.
    PostApiV1PromptsImportRequest:
      type: object
      properties:
        schemaVersion:
          type: integer
          description: Must be 1.
        exportedAt:
          type: string
          description: ISO‑8601 timestamp of the export.
        prompt:
          type: object
          description: Prompt metadata.
        prompt.name:
          type: string
          description: Name of the prompt.
        prompt.description:
          type: string
          description: Optional description.
        version:
          type: object
          description: Version data.
        version.versionNumber:
          type: integer
          description: Version number (defaults to 1).
        version.messages:
          type: array
          description: Array of message objects.
        version.messages[].role:
          type: string
          description: Message role (e.g., system).
        version.messages[].content:
          type: string
          description: Message content with templating.
        version.variables:
          type: array
          description: List of variable names (ignored on import).
        version.createdAt:
          type: string
          description: ISO‑8601 timestamp of version creation.
      required:
      - schemaVersion
      - prompt
      - prompt.name
      - version
      - version.messages
      - version.messages[].role
      - version.messages[].content
    PostPromptsIdVersionsRequest:
      type: object
      properties:
        messages:
          type: array
          description: Array of message objects with role and content
      required:
      - messages
    PostPromptsRequest:
      type: object
      properties:
        name:
          type: string
          description: Prompt name
        description:
          type: string
          description: Prompt description
      required:
      - name
      - description
