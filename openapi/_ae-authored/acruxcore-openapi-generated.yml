components:
  schemas:
    GetAccountApiKeysResponse:
      type: object
      properties:
        trail:
          type: array
          items:
            type: object
            properties:
              model:
                type: string
              modelId:
                type: string
              attempts:
                type: integer
              credentialId:
                type: string
              upstreamModel:
                type: string
        warning:
          type: object
          properties:
            type:
              type: string
            message:
              type: string
        attempts:
          type: integer
        cacheHit:
          type: boolean
    PostApiV1Response:
      type: object
      properties:
        toolId:
          type: string
        toolName:
          type: string
        toolAlias:
          type: string
        pinnedVersionNumber:
          type:
          - string
          - 'null'
        'off':
          type: boolean
        resolvedVersionNumber:
          type: integer
        position:
          type: integer
    GetApiV1PromptsVersionsTracesResponse:
      type: object
      properties:
        data:
          type: array
          description: Array of trace summary objects.
        total:
          type: integer
          description: Total number of matching traces.
        page:
          type: integer
          description: Current page number.
        limit:
          type: integer
          description: Page size returned.
    PostApiV1PromptsImportRequest:
      type: object
      properties:
        schemaVersion:
          type: integer
          description: Must be 1.
        exportedAt:
          type: string
          description: ISO‑8601 timestamp of the export.
        prompt:
          type: object
          description: Prompt metadata.
        prompt.name:
          type: string
          description: Name of the prompt.
        prompt.description:
          type: string
          description: Optional description.
        version:
          type: object
          description: Version data.
        version.versionNumber:
          type: integer
          description: Version number (defaults to 1).
        version.messages:
          type: array
          description: Array of message objects.
        version.messages[].role:
          type: string
          description: Message role (e.g., system).
        version.messages[].content:
          type: string
          description: Message content with templating.
        version.variables:
          type: array
          description: List of variable names (ignored on import).
        version.createdAt:
          type: string
          description: ISO‑8601 timestamp of version creation.
      required:
      - schemaVersion
      - prompt
      - prompt.name
      - version
      - version.messages
      - version.messages[].role
      - version.messages[].content
    PostApiV1PromptsImportResponse:
      type: object
      properties:
        prompt:
          type: object
          description: Created prompt.
        prompt.id:
          type: string
          description: Prompt identifier.
        prompt.name:
          type: string
          description: Name of the created prompt (may be altered on collision).
        version:
          type: object
          description: Created version.
        version.id:
          type: string
          description: Version identifier.
        version.versionNumber:
          type: integer
          description: Version number.
    GetApiV1TracesIdResponse:
      type: object
      properties:
        trace:
          type: object
          description: Trace header fields.
        spans:
          type: array
          description: Array of span objects assembled into a tree.
    GetApiV1TracesFacetsValuesResponse:
      type: object
      properties:
        values:
          type: array
          description: All distinct facet values.
    GetApiV1V1IdResponse:
      type: object
      properties:
        data:
          type: array
          description: List of prompts.
    PostApiV1V1IdRequest:
      type: object
      properties:
        name:
          type: string
          description: Tool name matching ^[a-zA-Z0-9_-]{1,64}$
        description:
          type: string
