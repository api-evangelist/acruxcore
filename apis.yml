aid: acruxcore

name: Acrux Core

image: https://acruxcore.com/og-image.png

description: Acrux Core is an open-source LLMOps platform designed for engineering teams to manage, version, and evaluate prompts, gateways, and
  tools across multiple LLM providers. It offers self-hostable deployment via Docker, a hosted beta, and SDKs for TypeScript and Python. Features
  include prompt versioning, tool integration, tracing, audit trails, and cost monitoring, all under an Apache-2.0 license.

